{% extends "base.html" %}

{% block title %}{{ t('auth.forgot_password_title') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-12 sm:py-16">
    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-soft border border-slate-200/90">

        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-brand-50 border border-brand-200/60 flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">{{ t('auth.forgot_password_headline') }}</h1>
            <p class="text-xs text-slate-500 mt-2 max-w-xs mx-auto">{{ t('auth.forgot_password_desc') }}</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-4" id="forgotForm">
            <div>
                <label class="block text-slate-700 font-bold mb-1.5 text-xs uppercase tracking-wider">{{ t('auth.email_label') }}</label>
                <input type="email" name="email" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs sm:text-sm bg-slate-50/50" placeholder="name@company.com">
            </div>
            <button type="submit" id="forgotBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-xs sm:text-sm">
                {{ t('auth.send_reset_email') }}
            </button>
        </form>

        <p class="text-center mt-6 text-slate-500 text-xs">
            <a href="{{ url_for('login') }}" class="text-brand-600 font-bold hover:underline">{{ t('auth.back_to_login') }}</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgotForm').addEventListener('submit', function() {
    const btn = document.getElementById('forgotBtn');
    btn.disabled = true;
    btn.textContent = '{{ t("auth.sending") }}';
    btn.classList.add('opacity-75', 'cursor-not-allowed');
});
</script>
{% endblock %}
