{% extends "base.html" %}

{% block title %}{{ t('auth.select_role_title') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-16 sm:py-24">
    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-soft border border-slate-200/90">

        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-lg mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">{{ t('auth.select_role_headline') }}</h1>
            <p class="text-sm text-slate-500 mt-2">
                {{ t('auth.welcome_google') }} <span class="font-semibold text-slate-700">{{ google_name }}</span>
            </p>
            <p class="text-xs text-slate-400 mt-1">{{ google_email }}</p>
        </div>

        <form method="POST" action="{{ url_for('select_role') }}" id="roleForm">
            <div class="space-y-3 mb-6">
                <label class="cursor-pointer border-2 border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-brand-500 hover:bg-brand-50/30 transition group">
                    <input type="radio" name="role" value="client" class="text-brand-600 w-5 h-5" required>
                    <div>
                        <span class="text-2xl">🏢</span>
                    </div>
                    <div>
                        <span class="font-bold text-slate-900 text-sm block">{{ t('auth.role_client_full') }}</span>
                        <span class="text-xs text-slate-400">{{ t('auth.role_hirer_desc') }}</span>
                    </div>
                </label>

                <label class="cursor-pointer border-2 border-slate-200 rounded-2xl p-5 flex items-center gap-4 hover:border-brand-500 hover:bg-brand-50/30 transition group">
                    <input type="radio" name="role" value="interpreter" class="text-brand-600 w-5 h-5">
                    <div>
                        <span class="text-2xl">🎓</span>
                    </div>
                    <div>
                        <span class="font-bold text-slate-900 text-sm block">{{ t('auth.role_interpreter_full') }}</span>
                        <span class="text-xs text-slate-400">{{ t('auth.role_translator_desc') }}</span>
                    </div>
                </label>
            </div>

            <button type="submit" id="roleBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-sm">
                {{ t('auth.continue_btn') }}
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('input[name="role"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        document.querySelectorAll('input[name="role"]').forEach(function(r) {
            r.closest('label').classList.remove('border-brand-500', 'bg-brand-50/30');
            r.closest('label').classList.add('border-slate-200');
        });
        this.closest('label').classList.add('border-brand-500', 'bg-brand-50/30');
        this.closest('label').classList.remove('border-slate-200');
    });
});

document.getElementById('roleForm').addEventListener('submit', function() {
    const btn = document.getElementById('roleBtn');
    btn.disabled = true;
    btn.classList.add('opacity-75', 'cursor-not-allowed');
});
</script>
{% endblock %}
