{% extends "base.html" %}

{% block title %}{{ t('auth.login_title') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-12 sm:py-16">
    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-soft border border-slate-200/90">
        
        <div class="text-center mb-8">
            <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-brand-600 bg-brand-50 border border-brand-200/60 px-3 py-1 rounded-full mb-2">
                {{ t('auth.login_badge') }}
            </span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">{{ t('auth.login_headline') }}</h1>
            <p class="text-xs text-slate-500 mt-1">{{ t('auth.login_sub') }}</p>
        </div>
        
        </div>


        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') }}">
            <div>
                <label class="block text-slate-700 font-bold mb-1.5 text-xs uppercase tracking-wider">{{ t('auth.email_label') }}</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs sm:text-sm bg-slate-50/50"
                       value="{{ email or '' }}"
                       autocomplete="off">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-slate-700 font-bold text-xs uppercase tracking-wider">{{ t('auth.password_label') }}</label>
                    <a href="{{ url_for('forgot_password') }}" class="text-[11px] text-brand-600 hover:text-brand-700 font-semibold">{{ t('auth.forgot_password') }}</a>
                </div>
                <div class="relative">
                    <input type="password" id="password_input" name="password" required
                           class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs sm:text-sm bg-slate-50/50 pr-10"
                           autocomplete="new-password">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <svg id="eye_icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <!-- Eye Open -->
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <script>
                function togglePassword() {
                    const pwdInput = document.getElementById('password_input');
                    const eyeIcon = document.getElementById('eye_icon');
                    if (pwdInput.type === 'password') {
                        pwdInput.type = 'text';
                        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
                    } else {
                        pwdInput.type = 'password';
                        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
                    }
                }
            </script>
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-xs sm:text-sm mt-2">
                {{ t('auth.login_button') }}
            </button>
        </form>
        
        <p class="text-center mt-6 text-slate-500 text-xs">
            {{ t('auth.no_account') }} <a href="{{ url_for('register') }}" class="text-brand-600 font-bold hover:underline">{{ t('auth.register_link') }}</a>
        </p>
    </div>
</div>
{% endblock %}
